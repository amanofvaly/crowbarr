# Use with compose.yaml for NVIDIA GPU acceleration:
#   docker compose -f compose.yaml -f compose.cuda.yaml up -d
# Requires the NVIDIA Container Toolkit on the host.
services:
  crowbarr:
    image: ghcr.io/amanofvaly/crowbarr:latest-cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
