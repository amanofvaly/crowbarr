[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crowbarr"
dynamic = ["version"]
description = "Automatic audio-grounded subtitles for the arr ecosystem"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
asr = ["faster-whisper==1.2.1"]
inference = ["faster-whisper==1.2.1", "whisperx==3.8.6"]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
crowbarr = "crowbarr.__main__:main"

[tool.setuptools.packages.find]
include = ["crowbarr*"]

[tool.setuptools.package-data]
crowbarr = ["static/*", "static/vendor/*"]

[tool.setuptools.dynamic]
version = {attr = "crowbarr.version.APPLICATION_VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
